<!doctype html>
<html lang="bn">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Private Dashboard — Tahmina Ferdous Upoma</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/dashboard.css">
</head>
<body>
  <header class="top"><div class="wrap top-inner"><a class="brand" href="index.html">Tahmina Ferdous <span>Upoma</span></a><a class="back" href="index.html">← মূল ওয়েবসাইট</a></div></header>
  <main class="wrap main">
    <span class="eyebrow">Private dashboard</span>
    <h1 class="title">Contact requests</h1>
    <p class="subtitle">আপনার ওয়েবসাইটের contact form থেকে আসা বার্তাগুলো এখানে দেখা যাবে।</p>
    <section class="panel login" id="login-panel">
      <h2>আপনার email দিয়ে sign in করুন</h2>
      <p class="hint">আপনার inbox-এ sign-in link পাঠানো হবে। Contact request দেখতে কেবল অনুমোদিত email-এ sign in করা যাবে।</p>
      <form id="login-form"><div class="field"><label for="email">Dashboard email</label><input id="email" name="email" type="email" autocomplete="email" required placeholder="you@example.com"></div><button class="button" type="submit">Sign-in link পাঠান</button></form>
      <p class="status" id="login-status" role="status" aria-live="polite"></p>
    </section>
    <section class="panel hidden" id="dashboard-panel">
      <div class="dash-head"><h2>আপনার enquiries</h2><div><span class="count" id="request-count">0টি</span> <button class="signout" id="signout-button" type="button">Sign out</button></div></div>
      <p class="status" id="dashboard-status" role="status" aria-live="polite"></p>
      <div class="lead-list" id="lead-list"></div>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
  <script src="assets/dashboard.js" defer></script>
</body>
</html>
